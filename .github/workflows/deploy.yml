name: Deploy Expense Tracker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Record Deployment Start
        run: echo "DEPLOY_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Validate Project
        id: deploy
        run: |
          test -f index.html
          test -f login.html
          test -f register.html
          test -f script.js
          echo "Expense Tracker project validated successfully"

      - name: Send Deployment Insights
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - DEPLOY_START))

          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            STATUS="Success"
          else
            STATUS="Failed"
          fi

          curl --fail-with-body -sS -X POST \
            "${{ secrets.DEPLOYMENT_INSIGHTS_URL }}/api/deployments" \
            -H "Content-Type: application/json" \
            -d "{
              \"project\": \"Expense Tracker\",
              \"version\": \"v${{ github.run_number }}\",
              \"environment\": \"Production\",
              \"status\": \"$STATUS\",
              \"duration\": \"${DURATION}s\",
              \"deployedBy\": \"${{ github.actor }}\",
              \"commit\": \"${{ github.sha }}\",
              \"branch\": \"${{ github.ref_name }}\"
            }"
