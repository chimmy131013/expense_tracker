name: Deploy Expense Tracker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout the latest code
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Start deployment timer
      - name: Start deployment timer
        run: |
          echo "DEPLOY_START=$(date +%s)" >> $GITHUB_ENV


      # 3. Deploy application to AWS EC2
      - name: Deploy to AWS EC2
        env:
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          echo "$EC2_SSH_KEY_B64" | base64 -d > expense_tracker_key.pem
          chmod 600 expense_tracker_key.pem

          ssh -o StrictHostKeyChecking=no \
            -i expense_tracker_key.pem \
            ubuntu@3.108.154.68 \
            "cd ~/expense_tracker && \
            git pull origin main && \
            docker stop expense_tracker || true && \
            docker rm expense_tracker || true && \
            docker build -t expense_tracker . && \
            docker run -d \
            --restart unless-stopped \
            -p 80:80 \
            --name expense_tracker \
            expense_tracker"

          rm -f expense_tracker_key.pem


      # 4. Check whether the deployed application is running
      - name: Verify deployment
        run: |
          sleep 10

          curl -f http://3.108.154.68/ || exit 1


      # 5. Record deployment automatically in Deployment Insights
      - name: Record deployment in Deployment Insights
        if: always()
        env:
          DEPLOYMENT_INSIGHTS_URL: ${{ secrets.DEPLOYMENT_INSIGHTS_URL }}
        run: |

          END_TIME=$(date +%s)

          if [ -n "$DEPLOY_START" ]; then
            DURATION=$((END_TIME - DEPLOY_START))
          else
            DURATION=0
          fi

          if [ "${{ job.status }}" = "success" ]; then
            STATUS="Success"
          else
            STATUS="Failed"
          fi

          echo "Deployment Status: $STATUS"
          echo "Deployment Duration: ${DURATION}s"

          curl -X POST "$DEPLOYMENT_INSIGHTS_URL/api/deployments" \
            -H "Content-Type: application/json" \
            -d "{
              \"project\": \"Expense Tracker\",
              \"version\": \"${{ github.sha }}\",
              \"status\": \"$STATUS\",
              \"environment\": \"Production\",
              \"deployedBy\": \"${{ github.actor }}\",
              \"commit\": \"${{ github.sha }}\",
              \"branch\": \"${{ github.ref_name }}\",
              \"duration\": \"${DURATION}s\"
            }"


      # 6. Clean up SSH key
      - name: Cleanup
        if: always()
        run: |
          rm -f expense_tracker_key.pem