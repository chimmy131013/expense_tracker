name: Deploy Expense Tracker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2
        env:
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          echo "$EC2_SSH_KEY_B64" | base64 -d > expense_tracker_key.pem
          chmod 600 expense_tracker_key.pem

          ssh -o StrictHostKeyChecking=no -i expense_tracker_key.pem ubuntu@3.108.154.68 "cd ~/expense_tracker && git pull origin main && docker stop expense_tracker || true; docker rm expense_tracker || true; docker build -t expense_tracker . && docker run -d --restart unless-stopped -p 80:80 --name expense_tracker expense_tracker"

          rm -f expense_tracker_key.pem

      - name: Record deployment in Deployment Insights
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="Success"
          else
            STATUS="Failed"
          fi

          curl -X POST "${{ secrets.DEPLOYMENT_INSIGHTS_URL }}/api/deployments" \
            -H "Content-Type: application/json" \
            -d "{
              \"project\": \"Expense Tracker\",
              \"version\": \"${{ github.sha }}\",
              \"status\": \"$STATUS\",
              \"deployedBy\": \"${{ github.actor }}\",
              \"commit\": \"${{ github.sha }}\",
              \"branch\": \"${{ github.ref_name }}\"
            }" || true
