name: Deploy Expense Tracker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/expense_tracker

            git pull origin main

            docker stop expense_tracker || true
            docker rm expense_tracker || true

            docker build -t expense_tracker .

            docker run -d \
              --restart unless-stopped \
              -p 80:80 \
              --name expense_tracker \
              expense_tracker

      - name: Record deployment in Deployment Insights
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="Success"
          else
            STATUS="Failed"
          fi

          curl -X POST "${{ secrets.DEPLOYMENT_INSIGHTS_URL }}/api/deployments" \
            -H "Content-Type: application/json" \
            -d "{
              \"project\": \"Expense Tracker\",
              \"version\": \"${{ github.sha }}\",
              \"status\": \"$STATUS\",
              \"deployedBy\": \"${{ github.actor }}\",
              \"commit\": \"${{ github.sha }}\",
              \"branch\": \"${{ github.ref_name }}\"
            }" || true